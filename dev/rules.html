<!doctype html>
<html><head><meta charset="utf-8"><title>rules</title></head>
<body><pre id="out">running…</pre>
<script src="../js/config.js"></script><script src="../js/util.js"></script>
<script src="../js/spawner.js"></script><script src="../js/world.js"></script><script src="../js/bot.js"></script>
<script>
const C = Q.C, GY = C.GROUND, H = C.MAX_HEARTS;   // H = hearts at the start of a run
const NO = { left:false,right:false,down:false,jumpHeld:false,jumpPressed:false,throwPressed:false,bombPressed:false };
const res = [];
function test(name, fn) { try { const r = fn(); res.push((r === true ? 'PASS ' : 'FAIL ') + name + (r === true ? '' : ' -> ' + r)); } catch (e) { res.push('ERR  ' + name + ' -> ' + e.message); } }
function fresh() { const w = new Q.World(); w.spawner.update = () => {}; return w; }       // no random spawns
function run(w, secs, inp) { for (let i = 0; i < secs * 60; i++) { w.update(1/60, typeof inp === 'function' ? inp(i) : (inp || NO)); } }
const P = (o) => Object.assign({}, NO, o);

test('idle player runs on ground, scroll ramps up', () => { const w = fresh(); run(w, 5); return w.player.onGround && w.scroll > C.BASE_SPEED || 'scroll=' + w.scroll; });
test('jump leaves ground, apex ~ 130-145px', () => {
  const w = fresh(); let min = GY;
  run(w, 1.2, (i) => { min = Math.min(min, w.player.y); return P({ jumpPressed: i === 0, jumpHeld: true }); });
  const h = GY - min; return (h > 120 && h < 150) || 'apex=' + h.toFixed(1);
});
test('tap jump is a short hop', () => {
  const w = fresh(); let min = GY;
  run(w, 1, (i) => { min = Math.min(min, w.player.y); return P({ jumpPressed: i === 0, jumpHeld: i < 3 }); });
  const h = GY - min; return (h > 20 && h < 90) || 'hop=' + h.toFixed(1);
});
test('double jump works once, third press does nothing', () => {
  const w = fresh(); let jumps = 0, dj = 0;
  run(w, 1.4, (i) => { for (const e of w.events) { if (e.type === 'jump') jumps++; if (e.type === 'djump') dj++; } w.events.length = 0; return P({ jumpPressed: i === 0 || i === 20 || i === 30, jumpHeld: true }); });
  return (jumps === 1 && dj === 1) || `jumps=${jumps} djumps=${dj}`;
});
test('obstacle hurts, then i-frames prevent double damage', () => {
  const w = fresh(); w.obstacles.push({ kind: 'cone', x: w.player.x - 13, y: GY, w: 26, h: 32 });
  run(w, 0.3); const h1 = w.hearts; w.obstacles.push({ kind: 'cone', x: w.player.x - 13, y: GY, w: 26, h: 32 }); run(w, 0.1);
  return (h1 === H - 1 && w.hearts === H - 1) || `h1=${h1} h2=${w.hearts}`;
});
test('three hits = dead = gameover event after fall', () => {
  const w = fresh(); let over = false;
  for (let k = 0; k < H; k++) { w.player.invuln = 0; w.player.y = GY; w.player.vy = 0; w.player.hurtT = 0; w.obstacles.length = 0; w.obstacles.push({ kind: 'cone', x: w.player.x - 13, y: GY, w: 26, h: 32 }); run(w, 0.2); }
  run(w, 2); over = w.over && w.hearts === 0 && w.player.dead; return over || `over=${w.over} hearts=${w.hearts}`;
});
test('coin +1, banknote +5, score bonus', () => {
  const w = fresh(); w.coins.push({ kind: 'coin', x: w.player.x, y: GY - 30, r: 11, value: 1 }, { kind: 'note', x: w.player.x, y: GY - 30, r: 14, value: 5 });
  run(w, 0.1); return (w.money === 6 && w.bonus >= 70) || `money=${w.money} bonus=${w.bonus}`;
});
test('paper pickup adds ammo, capped', () => {
  const w = fresh(); w.ammo = C.MAX_AMMO; w.items.push({ kind: 'paper', x: w.player.x, y: GY - 30, r: 15, ph: 0 }); run(w, 0.1);
  const a = w.ammo; w.ammo = 2; w.items.push({ kind: 'paper', x: w.player.x, y: GY - 30, r: 15, ph: 0 }); run(w, 0.1);
  return (a === C.MAX_AMMO && w.ammo === 3) || `cap=${a} then=${w.ammo}`;
});
test('throw consumes ammo, 2 papers kill Francone (hp 2)', () => {
  const w = fresh(); w.ammo = 6; const e = w.spawnOldMan(); e.x = 700; e.state = 'stalk'; e.anchor = 700; e.next = 999;
  let thrown = 0; run(w, 4, (i) => P({ throwPressed: i % 15 === 0 }));
  return (e.dead && w.ammo <= 2 && w.kills === 1) || `dead=${e.dead} ammo=${w.ammo} hp=${e.hp}`;
});
test('no ammo: throw does nothing', () => {
  const w = fresh(); w.ammo = 0; run(w, 0.2, (i) => P({ throwPressed: true })); return w.shots.length === 0 || 'shots=' + w.shots.length;
});
test('old man lunge hurts a grounded player but can be jumped', () => {
  const w = fresh(); const e = w.spawnOldMan(); e.x = 640; e.state = 'windup'; e.st = 0.7; e.anchor = 640;
  run(w, 2.5, (i) => P({ jumpPressed: i === 36, jumpHeld: i < 90 })); const jumped = w.hearts;
  const w2 = fresh(); const e2 = w2.spawnOldMan(); e2.x = 640; e2.state = 'windup'; e2.st = 0.7; e2.anchor = 640; run(w2, 2.5);
  return (jumped === H && w2.hearts === H - 1) || `jumped=${jumped} stood=${w2.hearts}`;
});
test('cat can be stomped (kill + bounce), not hurting', () => {
  const w = fresh(); const c = w.spawnCat(); c.x = w.player.x + 0; c.y = GY; c.state = 'run';
  w.player.y = GY - 34; w.player.vy = 300; w.player.onGround = false; w.player.prevY = GY - 38; run(w, 0.05);
  return (c.dead && w.hearts === H && w.player.vy < 0) || `dead=${c.dead} hearts=${w.hearts} vy=${w.player.vy}`;
});
test('cat on the ground hurts', () => {
  const w = fresh(); const c = w.spawnCat(); c.x = w.player.x; run(w, 0.1); return w.hearts === H - 1 || 'hearts=' + w.hearts;
});
test('no birds exist any more', () => !('spawnPigeon' in Q.World.prototype) || 'spawnPigeon still present');
test('SCUDETTO: blocks obstacles and enemies, no heart lost, no knockback, obstacle smashed', () => {
  const w = fresh(); w.startPower('shield');
  w.obstacles.push({ kind: 'cone', x: w.player.x - 13, y: GY, w: 26, h: 32 });
  const c = w.spawnCat(); c.x = w.player.x + 5; const o = w.spawnOldMan(); o.x = w.player.x; o.state = 'lunge'; o.lungeSpeed = 10;
  const ev = []; run(w, 0.5, () => { w.events.forEach((e) => ev.push(e.type)); w.events.length = 0; return NO; });
  return (w.hearts === H && w.obstacles.length === 0 && w.player.onGround && ev.includes('shield_block')) || `hearts=${w.hearts} obs=${w.obstacles.length} ev=${[...new Set(ev)]}`;
});
test('SCUDETTO: hurt() is a no-op, lasts 10s, then ends with grace period', () => {
  const w = fresh(); w.startPower('shield'); w.hurt(0); const h = w.hearts; run(w, 9.5); const still = w.power.type === 'shield'; run(w, 0.7);
  return (h === H && still && w.power.type === null && w.player.invuln > 0.2) || `h=${h} still=${still} power=${w.power.type}`;
});
test('SCUDETTO and MATITA appear in the power-up pool', () => {
  const w = fresh(); const seen = new Set(); const sp = w.spawner;
  const pat = sp.patterns.find((p) => p.name === 'powerUp'); w.t = 30;
  for (let i = 0; i < 300; i++) { w.items.length = 0; sp.cool.power = 0; pat.run(1000, w, sp); w.items.forEach((it) => seen.add(it.kind)); }
  return (seen.has('shield') && seen.has('bike') && seen.has('sword') && seen.has('skis') && seen.has('pencil')) || [...seen].join();
});
test('FRANCONE: tall and lanky hitbox, and only two lives', () => {
  const w = fresh(); const e = w.spawnOldMan(); return (e.h >= 90 && e.w <= 40 && e.h > w.player.h * 1.4 && e.hp === 2 && e.maxHp === 2) || `w=${e.w} h=${e.h} hp=${e.hp}`;
});
test('FRANCONE: says "SIGNORI" when he enters (once, not again on re-entry after a lunge)', () => {
  const w = fresh(); const e = w.spawnOldMan(); const said = [];
  run(w, 2.5, () => { w.events.forEach((ev) => { if (ev.type === 'speech') said.push(ev.text); }); w.events.length = 0; return NO; });
  const first = said.join('|');
  e.x = -100; e.state = 'lunge'; run(w, 3, () => { w.events.forEach((ev) => { if (ev.type === 'speech') said.push(ev.text); }); w.events.length = 0; return NO; }); // leaves left, re-enters from the right
  return (first === 'SIGNORI' && said.join('|') === 'SIGNORI') || `first=${first} all=${said.join('|')}`;
});
test('HEARTS: a run starts with 5 hearts (more lives), the max is 5, and a heart pickup heals only up to the max', () => {
  const w = fresh(); const start = w.hearts; w.hearts = 3; w.items.push({ kind: 'heart', x: w.player.x, y: GY - 30, r: 20, ph: 0 }); run(w, 0.1);
  const healed = w.hearts; w.items.push({ kind: 'heart', x: w.player.x, y: GY - 30, r: 20, ph: 0 }); w.hearts = C.MAX_HEARTS; const b0 = w.bonus; run(w, 0.1);
  return (start === 5 && C.MAX_HEARTS === 5 && healed === 4 && w.hearts === 5 && w.bonus >= b0 + C.SCORE.heart) || `start=${start} healed=${healed} full=${w.hearts}`;
});
test('MATITA: the first power-up of every run is the pencil, later ones are a mix', () => {
  const w = fresh(); const sp = w.spawner; const pat = sp.patterns.find((p) => p.name === 'powerUp'); w.t = 30;
  pat.run(1000, w, sp); const first = w.items.map((i) => i.kind)[0];
  const w2 = fresh(); const firsts = []; for (let i = 0; i < 20; i++) { const x = fresh(); x.t = 30; const s = x.spawner; s.patterns.find((p) => p.name === 'powerUp').run(1000, x, s); firsts.push(x.items[0].kind); }
  return (first === 'pencil' && firsts.every((k) => k === 'pencil')) || `first=${first} firsts=${firsts}`;
});
test('FRANCONE: first hit "CAZZO RIDI", second (killing) hit "LE DERIVATE"', () => {
  const w = fresh(); w.ammo = 8; const e = w.spawnOldMan(); e.x = 700; e.state = 'stalk'; e.anchor = 700; e.next = 999;
  const said = []; run(w, 3, (i) => { w.events.forEach((ev) => { if (ev.type === 'speech') said.push(ev.text); }); w.events.length = 0; return P({ throwPressed: i % 15 === 0 }); });
  return (e.dead && said.join('|') === 'CAZZO RIDI|LE DERIVATE') || `dead=${e.dead} said=${said.join('|')}`;
});
test('METEOR: aimed at the hero, warns first, hurts a hero who stands still (1 heart), then is gone', () => {
  const w = fresh(); const ev = []; const m = w.spawnMeteor(w.player.x);
  run(w, 2.2, () => { w.events.forEach((e) => ev.push(e.type)); w.events.length = 0; return NO; });
  return (w.hearts === H - 1 && ev[0] === 'meteor_warn' && ev.includes('meteor_impact') && ev.includes('hurt') && w.meteors.length === 0 && Math.abs(m.tx - 170) < 1) || `hearts=${w.hearts} ev=${[...new Set(ev)]} left=${w.meteors.length}`;
});
test('METEOR: can be dodged by stepping aside (no heart lost)', () => {
  const w = fresh(); w.spawnMeteor(w.player.x); let dir = 1;
  run(w, 2.2, (i) => P({ right: i < 40 })); // runs right for 0.67s, ~200px away from the target
  return (w.hearts === H && w.meteors.length === 0) || `hearts=${w.hearts} meteors=${w.meteors.length} x=${w.player.x.toFixed(0)}`;
});
test('METEOR: the ground fireball also hurts when it lands next to a standing hero, but only briefly', () => {
  const w = fresh(); w.spawnMeteor(w.player.x + 70); run(w, 2.2); const near = w.hearts;       // 70px away: rock misses, blast (r48 + half-width 15) misses too
  const v = fresh(); v.spawnMeteor(v.player.x + 50); run(v, 2.2);                              // 50px away: inside the fireball
  return (near === H && v.hearts === H - 1) || `70px=${near} 50px=${v.hearts}`;
});
test('METEOR: sword slices it, Vespa and scudetto shrug it off (bonus, no damage)', () => {
  const out = ['sword', 'bike', 'shield'].map((k) => { const w = fresh(); w.startPower(k); w.spawnMeteor(w.player.x); const ev = []; run(w, 2.2, () => { w.events.forEach((e) => ev.push(e.type)); w.events.length = 0; return NO; }); return w.hearts === H && w.bonus >= C.SCORE.meteor && ev.includes('meteor_smash'); });
  return out.every(Boolean) || out.join();
});
test('METEOR: the pencil does NOT protect from it; the bomb destroys it', () => {
  const w = fresh(); w.startPower('pencil'); w.spawnMeteor(w.player.x); run(w, 2.2);
  const v = fresh(); v.spawnMeteor(v.player.x); v.bombs = 1; run(v, 0.5, (i) => P({ bombPressed: i === 0 })); run(v, 2);
  return (w.hearts === H - 1 && v.hearts === H && v.meteors.length === 0) || `pencil hearts=${w.hearts} bomb hearts=${v.hearts}`;
});
test('METEOR: spawns by itself in a real run (later than 28s), never in water, one at a time', () => {
  const w = new Q.World(); let seen = 0, first = 0, bad = '', last = 0; w.hearts = 99;
  for (let i = 0; i < 60 * 240; i++) {
    w.update(1/60, NO); w.hearts = 99; w.player.invuln = 5;
    w.events.forEach((e) => { if (e.type === 'meteor_warn') { seen++; if (!first) first = w.t; if (w.water.length) bad = 'in water'; } }); w.events.length = 0;
    if (w.meteors.length > 1) bad = 'two at once';
  }
  return (seen >= 3 && first > 28 && !bad) || `seen=${seen} first=${first.toFixed(1)} bad=${bad}`;
});
test('MATITA: pierces cones, books and buoys without damage (and awards smash points), lasts 8s', () => {
  const w = fresh(); w.startPower('pencil');
  ['cone', 'books', 'buoy'].forEach((k, i) => w.obstacles.push({ kind: k, x: w.player.x + 40 + i * 80, y: GY, w: 30, h: 36 }));
  const ev = []; run(w, 1.5, () => { w.events.forEach((e) => ev.push(e.type + (e.src ? ':' + e.src : ''))); w.events.length = 0; return NO; });
  const done = w.hearts === H && w.obstacles.length === 0 && ev.filter((e) => e === 'smash:pencil').length === 3 && w.bonus >= 3 * C.SCORE.smash;
  run(w, 7); return (done && w.power.type === null) || `hearts=${w.hearts} obs=${w.obstacles.length} ev=${ev} power=${w.power.type}`;
});
test('MATITA: reaches obstacles in front of the body (pencil box)', () => {
  const w = fresh(); w.startPower('pencil'); w.obstacles.push({ kind: 'cone', x: w.player.x + 40, y: GY, w: 26, h: 32 });
  w.update(1/60, NO); return (w.obstacles.every((o) => o.gone) && w.hearts === H) || 'cone not smashed 40px ahead';
});
test('MATITA: skewers Figaro before he reaches the hero (kill event with src "pencil", no damage); Francone is not affected', () => {
  const w = fresh(); w.startPower('pencil'); const c = w.spawnCat(); c.x = w.player.x + 70; c.state = 'run'; c.run = 100;
  const ev = []; run(w, 0.5, () => { w.events.forEach((e) => ev.push(e.type + (e.src ? ':' + e.src : ''))); w.events.length = 0; return NO; });
  const v = fresh(); v.startPower('pencil'); const o = v.spawnOldMan(); o.x = v.player.x + 10; o.state = 'lunge'; o.lungeSpeed = 10; run(v, 0.3);
  return (c.dead && w.hearts === H && ev.includes('kill:pencil') && !o.dead && v.hearts === H - 1) || `catDead=${c.dead} hearts=${w.hearts} ev=${ev} oldDead=${o.dead} oldHearts=${v.hearts}`;
});
test('MATITA: Figaro stays impaled on the pencil tip for half a second, then is flung away (also when he is mid-pounce)', () => {
  const run1 = (state) => {
    const w = fresh(); w.startPower('pencil'); const c = w.spawnCat(); c.x = w.player.x + 70; c.state = state; c.run = 100;
    if (state === 'leap') { c.y = GY - 30; c.vy = 0; c.vx = -500; }
    run(w, 0.25); const dead = c.dead, stuck = Math.abs(c.x - (w.player.x + 50)) < 2; const t0 = c.deadT;
    run(w, 0.5); return dead && stuck && !c.skewer && c.vx > 0 && w.hearts === H;
  };
  const r = [run1('run'), run1('leap')]; return r.every(Boolean) || r.join();
});
test('MATITA: lost when diving into the pool', () => {
  const w = fresh(); w.startPower('pencil'); w.water.push({ x: 0, w: 900 }); run(w, 0.3); return (w.power.type === null && w.player.swim) || `power=${w.power.type}`;
});
test('SWIM: touching down in a pool switches to swimming (costume event, low hitbox), leaving switches back', () => {
  const w = fresh(); w.water.push({ x: 100, w: 600 }); const ev = [];
  run(w, 0.3, () => { w.events.forEach((e) => ev.push(e.type + (e.swim === undefined ? '' : ':' + e.swim))); w.events.length = 0; return NO; });
  const inWater = w.player.swim && w.player.w === 44 && w.player.h === 26;
  w.water[0].x = -2000; run(w, 0.2, () => { w.events.forEach((e) => ev.push(e.type + (e.swim === undefined ? '' : ':' + e.swim))); w.events.length = 0; return NO; });
  const out = !w.player.swim && w.player.h === 62;
  return (inWater && out && ev.includes('splash') && ev.includes('costume:true') && ev.includes('costume:false')) || `inWater=${inWater} out=${out} ev=${ev}`;
});
test('SWIM: jump key = unlimited strokes (floaty), apex ~ 90-110px, cooldown respected', () => {
  const w = fresh(); w.water.push({ x: 0, w: 5000 }); run(w, 0.2); let min = GY;
  run(w, 2, (i) => { min = Math.min(min, w.player.y); return P({ jumpPressed: i === 0, jumpHeld: true }); });
  const h = GY - min;
  const v = fresh(); v.water.push({ x: 0, w: 5000 }); run(v, 0.2); let n = 0, top = GY;
  run(v, 2, (i) => { top = Math.min(top, v.player.y); v.events.forEach((e) => { if (e.type === 'stroke') n++; }); v.events.length = 0; return P({ jumpPressed: i % 4 === 0, jumpHeld: true }); });
  return (w.player.swim && h > 85 && h < 115 && n >= 6 && GY - top > h + 40) || `swim=${w.player.swim} single apex=${h.toFixed(0)} spam strokes=${n} spam apex=${(GY - top).toFixed(0)}`;
});
test('SWIM: a jump taken over the water lands in it, then swims', () => {
  const w = fresh(); w.water.push({ x: 150, w: 900 }); w.player.x = 100; w.player.vx = 0;
  run(w, 0.05); run(w, 1.2, (i) => P({ jumpPressed: i === 0, jumpHeld: true, right: true }));
  return w.player.swim || 'not swimming; x=' + w.player.x.toFixed(0);
});
test('SWIM: Vespa and skis are lost when diving in; sword and scudetto are kept', () => {
  const a = fresh(); a.startPower('bike'); a.water.push({ x: 0, w: 900 }); run(a, 0.3);
  const b = fresh(); b.startPower('skis'); b.water.push({ x: 0, w: 900 }); run(b, 0.3);
  const c = fresh(); c.startPower('sword'); c.water.push({ x: 0, w: 900 }); run(c, 0.3);
  const d = fresh(); d.startPower('shield'); d.water.push({ x: 0, w: 900 }); run(d, 0.3);
  return (a.power.type === null && b.power.type === null && c.power.type === 'sword' && d.power.type === 'shield' && a.player.swim) || `${a.power.type},${b.power.type},${c.power.type},${d.power.type}`;
});
test('SWIM: buoys hurt a swimmer who does not stroke over them; a stroke clears them', () => {
  const w = fresh(); w.water.push({ x: 0, w: 5000 }); run(w, 0.3);
  w.obstacles.push({ kind: 'buoy', x: w.player.x + 150, y: GY, w: 28, h: 30 }); run(w, 1.2); const hit = w.hearts;
  const v = fresh(); v.water.push({ x: 0, w: 5000 }); run(v, 0.3);
  v.obstacles.push({ kind: 'buoy', x: v.player.x + 150, y: GY, w: 28, h: 30 });
  run(v, 1.2, (i) => P({ jumpPressed: i === 8, jumpHeld: true }));
  return (hit === H - 1 && v.hearts === H) || `idle=${hit} stroked=${v.hearts}`;
});
test('BOMB: kills every enemy on screen, consumes bomb, fires events in order', () => {
  const w = fresh(); w.spawnOldMan(); w.spawnCat(); w.spawnCat(); w.enemies.forEach((e) => (e.x = 600)); w.bombs = 1;
  const order = []; run(w, 0.6, (i) => { w.events.forEach((e) => { if (e.type.startsWith('bomb')) order.push(e.type); }); w.events.length = 0; return P({ bombPressed: i === 0 }); });
  const alive = w.enemies.filter((e) => !e.dead).length;
  return (alive === 0 && w.bombs === 0 && order.join() === 'bomb_arm,bomb_blast' && w.bombFx > 0) || `alive=${alive} bombs=${w.bombs} ev=${order}`;
});
test('bomb without stock does nothing', () => {
  const w = fresh(); w.bombs = 0; run(w, 0.5, () => P({ bombPressed: true })); return (w.bombFuse <= 0 && w.bombFx <= 0) || 'fired';
});
test('SWORD: kills old man on contact without damage, smashes obstacles', () => {
  const w = fresh(); w.startPower('sword'); const e = w.spawnOldMan(); e.x = w.player.x + 60; e.state = 'lunge'; e.lungeSpeed = 10;
  w.obstacles.push({ kind: 'books', x: w.player.x + 50, y: GY, w: 38, h: 42 }); run(w, 0.3);
  return (e.dead && w.hearts === H && w.obstacles.length === 0) || `dead=${e.dead} hearts=${w.hearts} obs=${w.obstacles.length}`;
});
test('BIKE: speed boost, immune, smashes obstacles, bumps old man', () => {
  const w = fresh(); w.startPower('bike'); run(w, 2);
  const fast = w.speedMul > 1.55; w.obstacles.push({ kind: 'cone', x: w.player.x, y: GY, w: 26, h: 32 });
  const e = w.spawnOldMan(); e.x = w.player.x + 20; e.state = 'lunge'; e.lungeSpeed = 10; run(w, 0.3);
  return (fast && w.hearts === H && w.obstacles.length === 0 && e.hp < 4) || `speedMul=${w.speedMul.toFixed(2)} hearts=${w.hearts} obs=${w.obstacles.length} hp=${e.hp}`;
});
test('SKIS: faster, lost when hurt', () => {
  const w = fresh(); w.startPower('skis'); run(w, 2); const fast = w.speedMul > 1.3;
  w.obstacles.push({ kind: 'cone', x: w.player.x, y: GY, w: 26, h: 32 }); run(w, 0.2);
  return (fast && w.power.type === null && w.hearts === H - 1) || `fast=${fast} power=${w.power.type} hearts=${w.hearts}`;

      const h = w.enemies.some((e) => e.kind === 'hall' && !e.dead), o = w.enemies.some((e) => e.kind === 'oldman' && !e.dead);

  const t = new Q.World(); let tHall = 0; t.hearts = 99;
  for (let i = 0; i < 60 * 240; i++) { t.update(1/60, Q.Bot.decide(t)); t.hearts = 99; t.player.invuln = 5; t.events.length = 0; if (t.enemies.some((e) => e.kind === 'hall')) tHall++; }
  return (halls >= 4 && !tog && tHall === 0) || `halls=${halls} together=${tog} inTullio=${tHall}`;
});
