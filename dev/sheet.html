<!doctype html>
<html><head><meta charset="utf-8"><title>sprite sheet</title>
<style>body{margin:0;background:#b9d6cc}canvas{display:block}</style></head>
<body><canvas id="c" width="1500" height="900"></canvas>
<script src="../js/config.js"></script><script src="../js/util.js"></script><script src="../js/art.js"></script>
<script>
const A = Q.Art, ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#c9e2d8'; ctx.fillRect(0,0,1500,900);
ctx.fillStyle = '#2b3a58'; [250,520,790].forEach(y => ctx.fillRect(0,y,1500,6));
function at(x,y,s,fn){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); fn(); ctx.restore(); }
const S = 3.3;
// row 1: hero on foot — run frames, jump, throw, bomb pose, hurt, happy
[0,0.5,1.0,1.6].forEach((p,i)=> at(70+i*95,250,S,()=>A.hero(ctx,{t:p,mode:'run',air:false,vy:0,expr:'normal'})));
at(450,250,S,()=>A.hero(ctx,{t:0.2,mode:'run',air:true,vy:-300,expr:'shout'}));
at(540,250,S,()=>A.hero(ctx,{t:0.3,mode:'run',air:false,vy:0,expr:'normal',throwP:0.8}));
at(630,250,S,()=>A.hero(ctx,{t:0.3,mode:'run',air:false,vy:0,expr:'shout',raise:1}));
at(720,250,S,()=>A.hero(ctx,{t:0.3,mode:'run',air:true,vy:200,expr:'hurt'}));
at(810,250,S,()=>A.hero(ctx,{t:0.3,mode:'run',air:false,vy:0,expr:'happy',raise:1}));
at(900,250,S,()=>A.hero(ctx,{t:0.3,mode:'sword',air:false,vy:0,expr:'focus'}));
at(1010,250,S,()=>A.hero(ctx,{t:0.3,mode:'skis',air:false,vy:0,expr:'focus'}));
at(1160,250,S,()=>{ctx.rotate(1.2);A.hero(ctx,{t:0.3,mode:'run',air:true,vy:0,expr:'dead'});});
// big head close-up
at(1330,150,9,()=>{ A.hero(ctx,{t:0.1,mode:'run',air:false,vy:0,expr:'normal'}); });
// row 2: bike, old man states, cat states
at(130,520,S,()=>A.bike(ctx,{t:0.2,expr:'happy'}));
['stalk','windup','lunge','stun'].forEach((st,i)=>at(420+i*130,520,S*0.7,()=>{ctx.scale(-1,1);A.oldman(ctx,{t:0.4+i,state:st});}));
['run','crouch','leap'].forEach((st,i)=>at(980+i*120,520,S,()=>{ctx.scale(-1,1);A.cat(ctx,{t:0.3,state:st,hiss:false});}));
at(1370,520,S,()=>{A.cat(ctx,{t:0.3,state:'dead'});});
// row 3: items & obstacles
at(80,790,S,()=>A.cone(ctx)); at(180,790,S,()=>A.books(ctx));
at(290,760,S,()=>A.coin(ctx,0)); at(360,760,S,()=>A.note(ctx,0)); at(450,760,S*1.5,()=>A.paper(ctx,0,1));
at(540,760,S,()=>A.bombItem(ctx,0)); at(620,760,S,()=>A.heart(ctx,0,1));
['bike','skis','sword','shield','pencil'].forEach((k,i)=>at(700+i*80,760,S*0.8,()=>A.powerBadge(ctx,k,0.5)));
at(1040,790,S,()=>A.buoy(ctx,0.3)); at(1130,760,S*1.3,()=>A.scudetto(ctx));
['bike','skis','sword','shield'].forEach((k,i)=>{});
at(930,770,S*0.0001,()=>{});
// swimming hero (three stroke phases + dolphin pitch)
ctx.fillStyle='#2fa8de'; ctx.fillRect(0,610,1500,40);
[0,0.25,0.5].forEach((p,i)=>at(160+i*150,640,S,()=>A.heroSwim(ctx,{t:p,expr:'normal'})));
at(640,640,S,()=>{ctx.translate(0,-14);ctx.rotate(-0.45);ctx.translate(0,14);A.heroSwim(ctx,{t:0.3,expr:'happy'});});
at(1220,770,S,()=>A.platform(ctx,100));
at(1380,790,S,()=>{ctx.rotate(-0.5);A.sword(ctx,54,1,0.3);});
</script></body></html>
